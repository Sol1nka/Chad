<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 450px; height: 90vh; background: #1e1e1e; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; word-break: break-word; background: #2a2a2a; }
        .msg.my { align-self: flex-end; background: #007bff; }
        .msg .author { font-size: 0.75em; opacity: 0.7; margin-bottom: 2px; }
        #input-area { display: flex; padding: 10px; background: #252525; gap: 8px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #333; color: #fff; outline: none; }
        button { padding: 10px 15px; border: none; background: #007bff; color: #fff; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="username" placeholder="Имя" style="width: 30%; flex: none;">
        <input type="text" id="message" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">></button>
    </div>
</div>

<script>
    const socket = io();
    const messages = document.getElementById('messages');

    socket.on('message', function(data) {
        const myName = document.getElementById('username').value || 'Аноним';
        const div = document.createElement('div');
        div.classList.add('msg');
        if (data.username === myName) div.classList.add('my');
        
        div.innerHTML = `<div class="author">${data.username}</div>${data.message}`;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    });

    function sendMsg() {
        const userField = document.getElementById('username');
        const msgField = document.getElementById('message');
        if (msgField.value.trim() !== '') {
            socket.send({
                username: userField.value || 'Аноним',
                message: msgField.value
            });
            msgField.value = '';
        }
    }
</script>
</body>
</html>
